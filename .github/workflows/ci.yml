# WORKFLOW DE INTEGRACIÓN CONTINUA (CI)
# Corre los tests unitarios nativos de Node en cada push y pull request a main.npm test
name: CI - Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Correr los tests unitarios (node --test)
        run: npm test